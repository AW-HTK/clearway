[package]
name = "clearway"
version = "0.1.2"
edition = "2024"
publish = false
license = "MIT"

[lib]
name = "clearway"
path = "src/lib.rs"

[features]
# Builds clearway-setup, which embeds the release files of dist/ (scripts/build-release.sh).
setup = []

[[bin]]
name = "clearway-setup"
path = "src/bin/clearway-setup/main.rs"
required-features = ["setup"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Release signature check (no dependency, no randomness needed to verify).
ed25519-compact = { version = "2", default-features = false }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_Storage_FileSystem",
    "Win32_System_ApplicationInstallationAndServicing",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_ProcessStatus",
    "Win32_System_Pipes",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_UI_Controls",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_System_WindowsProgramming",
    "Win32_UI_WindowsAndMessaging",
    "Wdk_System_SystemInformation",
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
